services:
  prometheus:
    image: prom/prometheus:v2.51.2
    container_name: observe-prometheus
    mem_limit: 512m
    network_mode: host
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
      # docker0 gateway bind (same rationale as tempo below): reachable from the host
      # and from bridge containers (grafana datasource = 172.17.0.1:9090), NOT from the
      # internet. 127.0.0.1 would cut grafana off; 0.0.0.0 exposed the UI + lifecycle API
      # publicly (found 2026-07-01).
      - "--web.listen-address=127.0.0.1:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    healthcheck:
      # must match --web.listen-address (host netmode: localhost no longer answers)
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.4.0
    container_name: observe-grafana
    mem_limit: 512m
    # host netmode + loopback bind: the host drops bridge->host-IP traffic (found
    # 2026-07-01 — the provisioned 172.17.0.1:9090 datasource never worked), so
    # grafana joins the host namespace and reaches prometheus/tempo via 127.0.0.1.
    # nginx (observe.cloudaura.cloud -> 127.0.0.1:3000) is unaffected.
    network_mode: host
    environment:
      - GF_SERVER_HTTP_ADDR=127.0.0.1
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:-changeme}
      - GF_SERVER_ROOT_URL=${GF_SERVER_ROOT_URL:-http://localhost:3000}
      - GF_SERVER_SERVE_FROM_SUB_PATH=false
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:v1.8.1
    container_name: observe-node-exporter
    mem_limit: 128m
    command:
      - "--path.rootfs=/host"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    volumes:
      - /:/host:ro,rslave
    ports:
      - "127.0.0.1:9100:9100"
    pid: host
    restart: unless-stopped

  langfuse-db:
    image: postgres:16-alpine
    container_name: observe-langfuse-db
    mem_limit: 512m
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-langfuse}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-changeme}
      - POSTGRES_DB=${POSTGRES_DB:-langfuse}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  langfuse:
    image: langfuse/langfuse:2
    container_name: observe-langfuse
    mem_limit: 512m
    environment:
      - DATABASE_URL=${LANGFUSE_DATABASE_URL:-postgresql://langfuse:changeme@langfuse-db:5432/langfuse}
      - NEXTAUTH_SECRET=${LANGFUSE_NEXTAUTH_SECRET:-changeme-nextauth-secret}
      - NEXTAUTH_URL=${LANGFUSE_NEXTAUTH_URL:-http://localhost:3001}
      - SALT=${LANGFUSE_SALT:-changeme-salt}
      - TELEMETRY_ENABLED=false
      - HOSTNAME=0.0.0.0
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      langfuse-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/api/public/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  tempo:
    image: grafana/tempo:2.7.2
    container_name: observe-tempo
    mem_limit: 512m
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./tempo/tempo.yaml:/etc/tempo.yaml:ro
      - tempo_data:/var/tempo
    ports:
      - "127.0.0.1:3200:3200"
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
      # docker0 gateway binding: OTLP ingest must stay reachable from bridge
      # containers (aura-platform exports to 172.17.0.1:4317); not internet-routable
      - "172.17.0.1:4317:4317"
      - "172.17.0.1:4318:4318"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3200/ready"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  loki:
    image: grafana/loki:3.3.0
    container_name: observe-loki
    mem_limit: 512m
    command: ["-config.file=/etc/loki/loki-config.yaml"]
    user: root  # needs to own /loki volume dirs
    volumes:
      - ./loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki_data:/loki
    ports:
      # loopback publish so host-net Grafana reaches it at 127.0.0.1:3100;
      # promtail reaches it via the bridge network as loki:3100
      - "127.0.0.1:3100:3100"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3100/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  promtail:
    image: grafana/promtail:3.3.0
    container_name: observe-promtail
    mem_limit: 128m
    command: ["-config.file=/etc/promtail/promtail-config.yaml"]
    volumes:
      - ./promtail/promtail-config.yaml:/etc/promtail/promtail-config.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      loki:
        condition: service_healthy
    restart: unless-stopped

volumes:
  prometheus_data:
  grafana_data:
  postgres_data:
  tempo_data:
  loki_data:

groups:
  - name: service_health
    rules:
      # Service down for more than 2 minutes
      - alert: ServiceDown
        expr: up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.service }} is down"
          description: "{{ $labels.service }} ({{ $labels.project }}) has been unreachable for 2 minutes."

      # High error rate (>5% of requests returning 5xx)
      - alert: HighErrorRate
        expr: |
          sum by (service) (rate(http_requests_total{status=~"5.."}[5m]))
          /
          sum by (service) (rate(http_requests_total[5m]))
          > 0.05
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "High error rate on {{ $labels.service }}"
          description: "{{ $labels.service }} has >5% error rate for 3 minutes."

      # High latency (p95 > 5s)
      - alert: HighLatency
        expr: |
          histogram_quantile(0.95,
            sum by (le, service) (rate(http_request_duration_seconds_bucket[5m]))
          ) > 5
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "High p95 latency on {{ $labels.service }}"
          description: "p95 latency on {{ $labels.service }} exceeds 5s for 3 minutes."

  - name: emissionload_health
    rules:
      # EmissionLoad failure rate above 5% over 30 minutes
      - alert: EmissionLoadHighFailureRate
        expr: |
          (
            sum(rate(aura_emissionload_container_executions_total{result!="success"}[30m]))
            /
            sum(rate(aura_emissionload_container_executions_total[30m]))
          ) > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "EmissionLoad failure rate above 5%"
          description: "EmissionLoad container failure rate has exceeded 5% over the last 30 minutes."

      # EmissionLoad P95 latency above 5 minutes
      - alert: EmissionLoadHighLatency
        expr: |
          histogram_quantile(0.95,
            sum by (le) (rate(aura_run_duration_seconds_bucket{job="aura-platform-worker"}[10m]))
          ) > 300
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "EmissionLoad run P95 latency above 5 minutes"
          description: "P95 deployment run duration exceeds 300s for 10 minutes."

      # Queue backlog above 5 for 15 minutes
      - alert: EmissionLoadQueueBacklog
        expr: aura_queue_depth > 5
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "EmissionLoad queue backlog"
          description: "Deployment run queue depth has been above 5 for 15 minutes."

      # No runs completed in 2 hours despite active schedule
      - alert: EmissionLoadNoRuns
        expr: |
          (time() - aura_scheduler_last_evaluation_timestamp) < 120
          and
          increase(aura_runs_completed_total[2h]) == 0
          and
          aura_scheduled_runs_total > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "No deployment runs completed in 2 hours"
          description: "Scheduler is active but no runs have completed in the last 2 hours."

      # Worker metrics endpoint unreachable
      - alert: AuraWorkerDown
        expr: up{job="aura-platform-worker"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Aura Worker is down"
          description: "Worker metrics endpoint (port 9091) has been unreachable for 2 minutes."

  - name: resource_health
    rules:
      # High CPU usage on host
      - alert: HighCPU
        expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage on {{ $labels.instance }}"
          description: "CPU usage above 85% for 5 minutes."

      # High memory usage on host
      - alert: HighMemory
        expr: (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100 > 90
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "High memory usage on {{ $labels.instance }}"
          description: "Memory usage above 90% for 5 minutes."

      # Disk space low
      - alert: DiskSpaceLow
        expr: (1 - node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) * 100 > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Disk space low on {{ $labels.instance }}"
          description: "Root filesystem usage above 85%."

  # E05 bench rules — scoped to service="faultsvc" so they never fire on real services.
  # Baseline tier: symptom-only (what every service gets for free).
  - name: bench_e05_baseline
    rules:
      - alert: BenchHighErrorRate
        expr: |
          sum(rate(http_requests_total{service="faultsvc",status=~"5.."}[1m]))
          / sum(rate(http_requests_total{service="faultsvc"}[1m])) > 0.05
        for: 30s
        labels: { severity: bench, tier: baseline }
      - alert: BenchHighLatency
        expr: |
          histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{service="faultsvc"}[1m]))) > 1
        for: 30s
        labels: { severity: bench, tier: baseline }
  # Enriched tier: names the failing component directly (only observable when telemetry=enriched).
  - name: bench_e05_enriched
    rules:
      - alert: BenchStageFailing
        expr: sum by (stage, kind) (rate(stage_errors_total{service="faultsvc"}[1m])) > 0.05
        for: 15s
        labels: { severity: bench, tier: enriched }
      - alert: BenchRetryStorm
        expr: sum by (stage) (rate(stage_retries_total{service="faultsvc"}[1m])) > 0.2
        for: 15s
        labels: { severity: bench, tier: enriched }
